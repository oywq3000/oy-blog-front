# oyblog.top 生产配置（nginx:alpine 容器内）
# 注意: 这是完整主配置，刻意不 include conf.d/*.conf —— 镜像自带 default.conf
#       也监听 80，include 会 listen 冲突导致容器起不来。
# 更新配置必须"就地覆盖"（cat >），不要 mv 换文件名 —— bind mount 钉住旧 inode，
# mv 后容器 reload 读到的仍是旧配置。

user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;      # 走 docker json-file 日志驱动，自动轮转
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Cloudflare Tunnel: cloudflared 与本机 nginx 之间是内网明文 http，
    # 真实协议/客户端 IP 由 Cloudflare 注入请求头，转发给后端时还原。
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_cf_connecting_ip $real_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # 绝不要加入 text/event-stream（SSE 流不能压缩）
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml font/woff2;

    server {
        listen       80 default_server;
        server_name  oyblog.top www.oyblog.top;

        root  /usr/share/nginx/html;
        index index.html;

        # 头像/封面/正文图片上传，默认 1m 会 413
        client_max_body_size 50m;

        # SPA 回退 + HTML 不缓存（history 路由深链接刷新必须回退到 index.html；
        # 不带 Cache-Control 时浏览器会按 Last-Modified 启发式缓存，发版后深链接可能白屏）
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # 带内容 hash 的构建资产：长缓存 immutable
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # public/ 原样拷贝的 logo（无 hash，变化频率极低）
        location = /logo.svg    { add_header Cache-Control "public, immutable, max-age=31536000" always; }
        location = /logo_zh.svg { add_header Cache-Control "public, immutable, max-age=31536000" always; }
        location = /logo_en.svg { add_header Cache-Control "public, immutable, max-age=31536000" always; }

        # API 同源反代：proxy_pass 尾斜杠 "/" 替换匹配到的 /api/ 前缀
        #   /api/user-service/x  ->  gateway /user-service/x（gateway StripPrefix=1）
        location /api/ {
            proxy_pass http://host.docker.internal:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $real_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout   620s;
            proxy_read_timeout   620s;   # 网关 SSE 路由最长 600s，nginx 必须更大
        }

        # SSE 流式对话 —— 最长前缀匹配优先于 /api/
        # 关键: proxy_pass 必须写完整替换路径。若写成 http://...:8080/，
        #       匹配到的整条 URI 会被替换成 /，gateway 收到 / 直接 404
        location /api/agent-service/chat/stream {
            proxy_pass http://host.docker.internal:8080/agent-service/chat/stream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $real_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Connection        '';

            proxy_buffering off;     # 必须关，否则流式响应被缓冲或断流
            proxy_cache off;
            proxy_read_timeout 620s;
            proxy_send_timeout 620s;
        }
    }

    # HTTPS/TLS 由 Cloudflare Tunnel 在边缘处理（浏览器访问 https://oyblog.top，
    # cloudflared 到本机是内网明文 http）。origin 无需证书，无需 443 server 块。
}
