<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tech Gradient matching the text logo -->
    <linearGradient id="logo_gradient_match" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    
    <!-- Subtle Glow -->
    <filter id="logo_glow_match" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Shape: Abstract 'O' Monogram constructed from geometric cuts -->
  <g filter="url(#logo_glow_match)">
    <!-- O Ring (Outer / Inner Cutout) -->
    <path fill-rule="evenodd" d="M20 8C13.4 8 8 13.4 8 20C8 26.6 13.4 32 20 32C26.6 32 32 26.6 32 20C32 13.4 26.6 8 20 8ZM20 14C16.7 14 14 16.7 14 20C14 23.3 16.7 26 20 26C23.3 26 26 23.3 26 20C26 16.7 23.3 14 20 14Z" fill="url(#logo_gradient_match)" />

    <!-- Accent Dot (Cyan) -->
    <circle cx="34" cy="8" r="2" fill="#00f2ff" />
  </g>
</svg>
